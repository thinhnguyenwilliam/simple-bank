# simple-bank/docker-compose.yml
# Cách xóa tất cả dangling image: docker image prune
# docker logs -f 3df2131a9bb3
# docker compose down
# docker compose up -d --build

services:
  postgres:
    image: postgres:16
    container_name: simple-bank-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: simplebank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simple-bank-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: simple-bank-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - simple-bank-network

  api:
    build: .
    container_name: simple-bank-api
    volumes:
      - ./logs/api:/app/logs
    command: ["./main"]
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      # - redis
    env_file:
      - app.env
    networks:
      - simple-bank-network


  worker:
    build: .
    container_name: simple-bank-worker
    volumes:
      - ./logs/worker:/app/logs
    command: ["./worker"]
    env_file:
      - app.env
    # depends_on:
    #   - redis
    #   - postgres
    networks:
      - simple-bank-network

volumes:
  postgres_data:

networks:
  simple-bank-network:
    external: true
    # driver: bridge

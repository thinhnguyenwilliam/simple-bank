# simple-bank/docker-compose.yml


services:
  postgres:
    image: postgres:16
    container_name: simple-bank-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: simplebank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simple-bank-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: simple-bank-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - simple-bank-network

  # api:
  #   build: .
  #   container_name: simple-bank-api
  #   restart: always
  #   depends_on:
  #     - postgres
  #   env_file:
  #     - app.env
  #   ports:
  #     - "8084:8084"
  #   networks:
  #     - simple-bank-network

volumes:
  postgres_data:

networks:
  simple-bank-network:
    driver: bridge

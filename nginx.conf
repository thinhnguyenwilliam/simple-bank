worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ===== BACKENDS =====
    upstream laptop_service {
        least_conn;
        server 127.0.0.1:50052;
    }

    upstream simple_bank_service {
        least_conn;
        server 127.0.0.1:50051;
    }

    # ===== gRPC + TLS + mTLS =====
    server {
        listen 8080 ssl http2;

        ssl_certificate         /etc/nginx/cert/server-cert.pem;
        ssl_certificate_key     /etc/nginx/cert/server-key.pem;

        # verify CLIENT cert
        ssl_client_certificate  /etc/nginx/cert/ca-cert.pem;
        ssl_verify_client       on;

        # ---- LaptopService ----
        location /pb.v1.LaptopService/ {
            grpc_pass grpc://laptop_service;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        # ---- SimpleBankService ----
        location /pb.v1.SimpleBankService/ {
            grpc_pass grpc://simple_bank_service;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }
    }
}
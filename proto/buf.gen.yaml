# simple-bank/proto/buf.gen.yaml
version: v1

plugins:
  - name: go
    out: ../pb
    opt:
      - paths=source_relative

  - name: go-grpc
    out: ../pb
    opt:
      - paths=source_relative

  - name: grpc-gateway
    out: ../pb
    opt:
      - paths=source_relative

  - name: openapiv2
    out: ../doc/swagger
    opt:
      - logtostderr=true
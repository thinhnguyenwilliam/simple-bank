// simple-bank/proto/pb/v1/laptop_message.proto
syntax = "proto3";

package pb.v1;
option go_package = "github.com/thinhcompany/simple-bank/pb/v1;pbv1";

import "pb/v1/memory_message.proto";
import "pb/v1/storage_message.proto";
import "pb/v1/screen_message.proto";
import "pb/v1/keyboard_message.proto";
import "pb/v1/processor_message.proto";
import "google/protobuf/timestamp.proto";

message Laptop {
  string id    = 1;
  string brand = 2;
  string name  = 3;

  CPU cpu = 4;
  Memory ram = 5;

  repeated GPU gpus = 6;
  repeated Storage storages = 7;

  Screen screen = 8;
  Keyboard keyboard = 9;

  oneof weight {
    double weight_kg = 10;
    double weight_lb = 11;
  }

  double price_usd = 12;
  uint32 release_year = 13;

  google.protobuf.Timestamp updated_at = 14;
}
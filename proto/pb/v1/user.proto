// simple-bank/proto/pb/v1/user.proto
syntax = "proto3";

package pb.v1;

option go_package = "github.com/thinhcompany/simple-bank/pb/v1;pbv1";

import "google/protobuf/timestamp.proto";



message User {
  string username = 1;
  string full_name = 2;
  string email = 3;
  google.protobuf.Timestamp password_changed_at = 4;
  google.protobuf.Timestamp created_at = 5;
}
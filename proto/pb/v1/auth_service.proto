// pc-book\proto\auth_service.proto
syntax = "proto3";


package pb.v1;
option go_package = "github.com/thinhcompany/simple-bank/pb/v1;pbv1";

// AuthService handles authentication
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

// Login request sent by client
message LoginRequest {
  string username = 1;
  string password = 2;
}

// Login response returned by server
message LoginResponse {
  string access_token = 1;
}
// simple-bank/proto/pb/v1/rpc_create_user.proto
syntax = "proto3";

package pb.v1;

option go_package = "github.com/thinhcompany/simple-bank/pb/v1;pbv1";

import "pb/v1/user.proto";

message CreateUserRequest {
  string username = 1;
  string full_name = 2;
  string email = 3;
  string password = 4;
}

message CreateUserResponse {
  User user = 1;
}
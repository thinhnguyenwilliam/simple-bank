// simple-bank\proto\rpc_create_user.proto
syntax = "proto3";

package pb;

option go_package = "github.com/thinhcompany/simple-bank/pb";

import "user.proto";

message CreateUserRequest {
  string username = 1;
  string full_name = 2;
  string email = 3;
  string password = 4;
}

message CreateUserResponse {
  User user = 1;
}
